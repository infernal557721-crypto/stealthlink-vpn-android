name: Build and Release Android APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v3
      with:
        gradle-version: 8.5

    - name: Get version from build.gradle.kts
      id: version
      run: |
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
        VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/[^0-9]//g')
        echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_OUTPUT
        echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT
        echo "Detected version: ${VERSION_NAME} (code: ${VERSION_CODE})"

    - name: Build with Gradle
      run: gradle assembleRelease --stacktrace --no-daemon

    - name: Rename APK
      run: cp app/build/outputs/apk/release/app-release.apk vpncode.apk

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: vpncode-apk
        path: vpncode.apk

    - name: Check if release exists
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: check_release
      run: |
        if gh release view "v${{ steps.version.outputs.VERSION_NAME }}" > /dev/null 2>&1; then
          echo "EXISTS=true" >> $GITHUB_OUTPUT
        else
          echo "EXISTS=false" >> $GITHUB_OUTPUT
        fi
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Create GitHub Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.check_release.outputs.EXISTS == 'false'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.version.outputs.VERSION_NAME }}
        name: VpnCode v${{ steps.version.outputs.VERSION_NAME }}
        body: |
          ## VpnCode v${{ steps.version.outputs.VERSION_NAME }}

          ### Установка:
          1. Скачайте APK файл ниже
          2. Разрешите установку из неизвестных источников
          3. Установите приложение

          ### Поддержка:
          Бот: @VpnCodeRU_bot
        files: vpncode.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Deploy APK to VPS
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: appleboy/scp-action@v0.1.7
      with:
        host: 81.200.154.49
        username: root
        password: ${{ secrets.VPS_PASSWORD }}
        source: "vpncode.apk"
        target: "/var/www/vpncode/"

    - name: Update version.json on VPS
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: 81.200.154.49
        username: root
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
          mkdir -p /var/www/vpncode
          printf '{"version":"%s","versionCode":%s}' "${{ steps.version.outputs.VERSION_NAME }}" "${{ steps.version.outputs.VERSION_CODE }}" > /var/www/vpncode/version.json
          chmod 644 /var/www/vpncode/vpncode.apk /var/www/vpncode/version.json
          echo "Deployed VpnCode v${{ steps.version.outputs.VERSION_NAME }}"
